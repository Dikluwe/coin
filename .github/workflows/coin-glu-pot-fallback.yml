name: Coin GLU POT fallback

on:
  push:
    branches: [codex/coin-portable-sampling-study]
    paths:
      - .github/workflows/coin-glu-pot-fallback.yml
      - CMakeLists.txt
      - src/glue/**
      - src/rendering/**
      - testsuite/CMakeLists.txt
      - testsuite/coinrender/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  glu-pot:
    name: GLU POT · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux OpenGL test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa-dev libx11-dev libxext-dev xvfb xauth
      - name: Configure Unix build without simage
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build-glu -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCOIN_BUILD_RENDER=ON
          -DCOIN_RENDER_BACKEND=RECORDING
          -DCOIN_BUILD_TESTS=ON
          -DSIMAGE_RUNTIME_LINKING=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_simage=TRUE
          -DGLU_RUNTIME_LINKING=ON
      - name: Configure Windows build without simage
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build-glu -G "Visual Studio 17 2022" -A x64
          -DCOIN_BUILD_RENDER=ON
          -DCOIN_RENDER_BACKEND=RECORDING
          -DCOIN_BUILD_TESTS=ON
          -DSIMAGE_RUNTIME_LINKING=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_simage=TRUE
          -DGLU_RUNTIME_LINKING=ON
      - name: Build texture sampling probe
        run: cmake --build build-glu --target CoinRenderTextureSamplingTest --config Release --parallel 4
      - name: Compare GLU POT fallback on Linux
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a ctest --test-dir build-glu -C Release
          -R 'CoinRenderTextureSampling(Capture|GluFallback)Test'
          --output-on-failure
      - name: Compare GLU POT fallback on Windows and macOS
        if: runner.os != 'Linux'
        run: >-
          ctest --test-dir build-glu -C Release
          -R 'CoinRenderTextureSampling(Capture|GluFallback)Test'
          --output-on-failure
