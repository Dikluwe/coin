name: Continuous Integration Build

on:
  workflow_dispatch:  # Allow manual triggers
  pull_request:
    branches: [ master ]
  #push:
  #  branches: [ master ]

jobs:
  ubuntu-build:
    name: Ubuntu · legacy renderer ${{ matrix.legacy_renderer.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        legacy_renderer:
          - value: 'ON'
            label: enabled
          - value: 'OFF'
            label: disabled
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install freeglut3-dev
          if [ "$LEGACY_RENDERER" = ON ]; then
            sudo apt-get -y install xvfb xauth libgl1-mesa-dri
          fi
        env:
          LEGACY_RENDERER: ${{ matrix.legacy_renderer.value }}
