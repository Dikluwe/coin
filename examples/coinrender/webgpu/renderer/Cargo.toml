[package]
name = "coinrender_webgpu_demo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wgpu = { version = "24", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = "=0.2.125"
wasm-bindgen-futures = "=0.4.75"
js-sys = "=0.3.102"
web-sys = { version = "=0.3.102", features = ["HtmlCanvasElement"] }
bytemuck = "1.21"
