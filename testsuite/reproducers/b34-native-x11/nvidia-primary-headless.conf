Section "ServerFlags"
 Option "AutoAddDevices" "false"
 Option "AutoAddGPU" "false"
 Option "DontVTSwitch" "true"
EndSection
Section "Files"
 ModulePath "/usr/lib/x86_64-linux-gnu/nvidia/xorg"
 ModulePath "/usr/lib/xorg/modules"
EndSection
Section "Device"
 Identifier "B34NVIDIA"
 Driver "nvidia"
 BusID "PCI:1:0:0"
 Option "AllowEmptyInitialConfiguration" "true"
 Option "UseDisplayDevice" "none"
 Option "ProbeAllGpus" "false"
EndSection
Section "Screen"
 Identifier "B34Screen"
 Device "B34NVIDIA"
 DefaultDepth 24
 SubSection "Display"
  Depth 24
  Virtual 640 480
 EndSubSection
EndSection
Section "ServerLayout"
 Identifier "B34Layout"
 Screen 0 "B34Screen"
EndSection
